[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudai_sso"
version = "1.0.0"
description = "PrudAI SSO plugin for Baserow: Keycloak OIDC + silent org-to-workspace provisioning"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
